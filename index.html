<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Inversión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f17; --panel:#131a26; --panel-2:#0f1521;
    --line:#1e2836; --line-soft:#171f2c;
    --text:#e8edf4; --muted:#8b97a8; --muted-2:#5d6b7e;
    --gain:#10b981; --gain-soft:#10b98122;
    --capital:#3b82f6; --capital-soft:#3b82f622;
    --accent:#10b981;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:clamp(16px,4vw,40px);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto}

  /* Header */
  header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
  header img{height:44px;width:auto;border-radius:8px}
  .logo-fallback{height:44px;width:44px;border-radius:10px;background:linear-gradient(135deg,var(--gain),#0d9488);
    display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:20px;color:#03130d}
  header h1{font-family:'Sora';font-weight:600;font-size:clamp(18px,3vw,24px);letter-spacing:-.02em}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}

  /* Fund chips */
  .funds{margin-bottom:24px}
  .funds-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
    cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:2px;min-width:96px}
  .chip:hover{border-color:#2c3a4f;transform:translateY(-1px)}
  .chip.active{border-color:var(--gain);background:var(--gain-soft)}
  .chip .ticker{font-family:'Sora';font-weight:600;font-size:14px;letter-spacing:.01em}
  .chip .ret{font-size:13px;color:var(--gain);font-variant-numeric:tabular-nums}
  .chip.active .ret{color:var(--gain)}
  .chip .ret.na{color:var(--muted-2)}

  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}

  /* Controls */
  .control{margin-bottom:22px}
  .control:last-child{margin-bottom:0}
  .control .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .control label{font-size:13px;color:var(--muted)}
  .val-input{font-family:'Sora';font-weight:600;font-size:18px;color:var(--text);background:transparent;
    border:none;text-align:right;width:140px;font-variant-numeric:tabular-nums;outline:none}
  .val-input:focus{color:var(--gain)}
  .val-suffix{color:var(--muted);font-size:14px;margin-left:2px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
    background:var(--line);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;
    border-radius:50%;background:var(--gain);border:3px solid var(--bg);cursor:pointer;
    box-shadow:0 0 0 1px var(--gain)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gain);
    border:3px solid var(--bg);cursor:pointer;box-shadow:0 0 0 1px var(--gain)}

  /* Result side */
  .result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .donut-wrap{position:relative;width:200px;height:200px;margin-bottom:8px}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut-center .tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2)}
  .donut-center .fv{font-family:'Sora';font-weight:700;font-size:clamp(22px,5vw,30px);letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;margin-top:2px}
  circle.seg{transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}

  .legend{display:flex;gap:20px;margin-top:14px}
  .legend .item{display:flex;align-items:center;gap:8px;font-size:13px}
  .dot{width:10px;height:10px;border-radius:3px}
  .dot.cap{background:var(--capital)} .dot.gn{background:var(--gain)}
  .legend .item .amt{font-family:'Sora';font-weight:600;font-variant-numeric:tabular-nums}
  .legend .item .lbl{color:var(--muted);font-size:12px;display:block}

  /* Table */
  .table-card{margin-top:20px}
  .table-card h2{font-family:'Sora';font-weight:600;font-size:15px;margin-bottom:14px;color:var(--text)}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th{text-align:right;color:var(--muted-2);font-weight:500;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 12px;border-bottom:1px solid var(--line-soft)}
  tr:last-child td{border-bottom:none}
  td.year{font-family:'Sora';font-weight:600;color:var(--text)}
  td.gain{color:var(--gain)}
  td.total{font-weight:600}

  .meta{margin-top:18px;font-size:12px;color:var(--muted-2);text-align:center}
  .meta b{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img src="logoR.png" alt="logo" onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>R</div>'">
    <div>
      <h1>Calculadora de Inversión</h1>
      <div class="sub">Interés compuesto con aportes mensuales</div>
    </div>
  </header>

  <div class="funds">
    <div class="funds-label">Elige un fondo — usa su rendimiento real a 10 años</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid">
    <!-- Controles -->
    <div class="card">
      <div class="control">
        <div class="top">
          <label for="r-inicial">Capital inicial</label>
          <div><span class="val-suffix">$</span><input class="val-input" id="inicial" type="text" inputmode="numeric" value="1,000"></div>
        </div>
        <input type="range" id="r-inicial" min="0" max="100000" step="500" value="1000">
      </div>

      <div class="control">
        <div class="top">
          <label for="r-mensual">Aporte mensual</label>
          <div><span class="val-suffix">$</span><input class="val-input" id="mensual" type="text" inputmode="numeric" value="250"></div>
        </div>
        <input type="range" id="r-mensual" min="0" max="5000" step="25" value="250">
      </div>

      <div class="control">
        <div class="top">
          <label for="r-anos">Plazo</label>
          <div><input class="val-input" id="anos" type="text" inputmode="numeric" value="20"><span class="val-suffix">años</span></div>
        </div>
        <input type="range" id="r-anos" min="1" max="40" step="1" value="20">
      </div>

      <div class="control">
        <div class="top">
          <label for="r-tasa">Rendimiento anual</label>
          <div><input class="val-input" id="tasa" type="text" inputmode="decimal" value="7.0"><span class="val-suffix">%</span></div>
        </div>
        <input type="range" id="r-tasa" min="0" max="20" step="0.1" value="7">
      </div>
    </div>

    <!-- Resultado -->
    <div class="card result">
      <div class="donut-wrap">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <g transform="rotate(-90 100 100)">
            <circle cx="100" cy="100" r="80" fill="none" stroke="var(--line)" stroke-width="20"/>
            <circle class="seg" id="seg-cap" cx="100" cy="100" r="80" fill="none" stroke="var(--capital)" stroke-width="20" stroke-linecap="butt"/>
            <circle class="seg" id="seg-gain" cx="100" cy="100" r="80" fill="none" stroke="var(--gain)" stroke-width="20" stroke-linecap="butt"/>
          </g>
        </svg>
        <div class="donut-center">
          <span class="tag">Valor final</span>
          <span class="fv" id="fv">$0</span>
        </div>
      </div>
      <div class="legend">
        <div class="item"><span class="dot cap"></span><div><span class="amt" id="leg-cap">$0</span><span class="lbl">Aportado</span></div></div>
        <div class="item"><span class="dot gn"></span><div><span class="amt" id="leg-gain">$0</span><span class="lbl">Ganancias</span></div></div>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card table-card">
    <h2>Crecimiento año por año</h2>
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr><th>Año</th><th>Aportado</th><th>Ganancias</th><th>Balance</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="meta" id="meta"></div>

</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const C = 2 * Math.PI * 80; // circunferencia del donut

// Fallback embebido si fund_returns.json no carga (ej. file://).
// Regenera el JSON real con update_returns.py.
let FUNDS = {
  FELAX:{r:null}, FKDNX:{r:null}, VADAX:{r:null}, FOCPX:{r:null}, FNIAX:{r:null}
};
let SOURCE = "valores manuales";

// ── Carga rendimientos reales ────────────────────────────────────────────────
async function loadFunds(){
  try{
    const res = await fetch('fund_returns.json', {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const next = {};
    for(const [tk, info] of Object.entries(data.funds || {})){
      const r10 = info?.returns?.['10y'];
      next[tk] = {r: (typeof r10 === 'number') ? r10 : null};
    }
    if(Object.keys(next).length) FUNDS = next;
    SOURCE = `${data.source || 'yfinance'} · actualizado ${data.as_of || ''}`;
  }catch(e){
    SOURCE = "valores de ejemplo (corre update_returns.py para datos reales)";
  }
  renderChips();
  document.getElementById('meta').innerHTML =
    `Datos: <b>${SOURCE}</b>. El rendimiento pasado no garantiza resultados futuros.`;
}

// ── Chips de fondos ──────────────────────────────────────────────────────────
function renderChips(){
  const c = document.getElementById('chips');
  c.innerHTML = '';
  for(const [tk, info] of Object.entries(FUNDS)){
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.ticker = tk;
    const retTxt = (info.r != null) ? info.r.toFixed(2) + '%' : 'n/d';
    el.innerHTML = `<span class="ticker">${tk}</span>
      <span class="ret ${info.r==null?'na':''}">${retTxt}</span>`;
    el.onclick = () => {
      if(info.r == null) return;
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      setTasa(info.r);
    };
    c.appendChild(el);
  }
}

// ── Sincronización slider <-> input ──────────────────────────────────────────
function parseNum(s){ return parseFloat(String(s).replace(/[^0-9.]/g,'')) || 0; }

function link(rangeId, inputId, fmtInput){
  const range = document.getElementById(rangeId);
  const input = document.getElementById(inputId);
  range.addEventListener('input', ()=>{ input.value = fmtInput(+range.value); calc(); });
  input.addEventListener('input', ()=>{ range.value = parseNum(input.value); calc(); });
  input.addEventListener('blur', ()=>{ input.value = fmtInput(parseNum(input.value)); });
}
function setTasa(v){
  document.getElementById('r-tasa').value = v;
  document.getElementById('tasa').value = (+v).toFixed(1);
  calc();
}

// ── Cálculo de interés compuesto ─────────────────────────────────────────────
function calc(){
  const P    = parseNum(document.getElementById('inicial').value);
  const PMT  = parseNum(document.getElementById('mensual').value);
  const anos = Math.max(1, Math.round(parseNum(document.getElementById('anos').value)));
  const rate = parseNum(document.getElementById('tasa').value) / 100;
  const i = rate / 12;

  const rows = [];
  let balance = P, aportado = P;
  for(let y = 1; y <= anos; y++){
    for(let m = 0; m < 12; m++){
      balance = balance * (1 + i) + PMT;
      aportado += PMT;
    }
    rows.push({y, aportado, ganancias: balance - aportado, balance});
  }

  const final = rows[rows.length - 1];
  document.getElementById('fv').textContent = fmt(final.balance);
  document.getElementById('leg-cap').textContent = fmt(final.aportado);
  document.getElementById('leg-gain').textContent = fmt(final.ganancias);

  // Donut
  const total = final.balance || 1;
  const fCap = Math.max(0, final.aportado / total);
  const fGain = Math.max(0, final.ganancias / total);
  const segCap = document.getElementById('seg-cap');
  const segGain = document.getElementById('seg-gain');
  segCap.setAttribute('stroke-dasharray', `${fCap*C} ${C}`);
  segCap.setAttribute('stroke-dashoffset', 0);
  segGain.setAttribute('stroke-dasharray', `${fGain*C} ${C}`);
  segGain.setAttribute('stroke-dashoffset', -fCap*C);

  // Tabla
  const tb = document.getElementById('tbody');
  tb.innerHTML = rows.map(r =>
    `<tr><td class="year">${r.y}</td>
      <td>${fmt(r.aportado)}</td>
      <td class="gain">+${fmt(r.ganancias)}</td>
      <td class="total">${fmt(r.balance)}</td></tr>`
  ).join('');
}

// ── Init ─────────────────────────────────────────────────────────────────────
link('r-inicial','inicial', v => v.toLocaleString('en-US'));
link('r-mensual','mensual', v => v.toLocaleString('en-US'));
link('r-anos','anos', v => String(Math.round(v)));
link('r-tasa','tasa', v => v.toFixed(1));
loadFunds();
calc();
</script>
</body>
</html>
