<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Inversión — Roberto Escobar Citty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1117; --surface:#161b24; --surface-2:#1d242f;
    --line:#2a323f; --line-soft:#1f2630;
    --text:#f2f4f8; --muted:#939db0; --muted-2:#69748a;
    --gold:#e0b15c; --gold-bright:#f0c574; --gold-soft:#e0b15c1f;
    --steel:#6f8bad; --steel-soft:#6f8bad22;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:clamp(14px,3.5vw,40px);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto}

  /* ── Header ───────────────────────────────────────────── */
  header{display:flex;align-items:center;gap:14px;margin-bottom:clamp(20px,3vw,30px)}
  header img{height:46px;width:auto;border-radius:9px;flex-shrink:0}
  .logo-fallback{height:46px;width:46px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg,var(--gold-bright),#b8863a);
    display:grid;place-items:center;font-family:'Sora';font-weight:700;font-size:20px;color:#1a1206}
  header h1{font-family:'Sora';font-weight:600;font-size:clamp(17px,3vw,23px);letter-spacing:-.02em;line-height:1.15}
  header .by{color:var(--gold);font-size:clamp(12px,2vw,13px);font-weight:500;margin-top:3px;letter-spacing:.01em}

  /* ── Fund chips ───────────────────────────────────────── */
  .funds{margin-bottom:clamp(18px,2.5vw,24px)}
  .funds-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);margin-bottom:11px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:11px 14px;cursor:pointer;transition:.16s;min-width:150px;flex:1 1 150px;max-width:220px}
  .chip:hover{border-color:#3a4659;transform:translateY(-1px)}
  .chip.active{border-color:var(--gold);background:var(--gold-soft)}
  .chip .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .chip .ticker{font-family:'Sora';font-weight:600;font-size:15px}
  .chip .ret{font-size:13px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip .ret.na{color:var(--muted-2)}
  .chip .fund-name{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.25}

  /* ── Main grid — FIJO, igual en desktop y móvil ───────── */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,18px)}
  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:clamp(14px,2.2vw,22px)}

  /* ── Controls / fields ────────────────────────────────── */
  .control{margin-bottom:clamp(14px,2vw,20px)}
  .control:last-child{margin-bottom:0}
  .control label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:500}
  .field{display:flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    transition:border-color .15s,box-shadow .15s;margin-bottom:11px}
  .field:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .field .sym{color:var(--muted);font-size:14px;font-weight:500;flex-shrink:0}
  .field .sym.suffix{order:2}
  .field input{background:transparent;border:none;outline:none;color:var(--text);
    font-family:'Sora';font-weight:600;font-size:clamp(15px,2.4vw,18px);width:100%;
    text-align:right;font-variant-numeric:tabular-nums;min-width:0}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;
    border-radius:4px;background:var(--line);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:18px;height:18px;border-radius:50%;background:var(--gold);
    border:3px solid var(--bg);cursor:pointer;box-shadow:0 0 0 1px var(--gold)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:var(--gold);border:3px solid var(--bg);cursor:pointer;box-shadow:0 0 0 1px var(--gold)}

  /* ── Result card ──────────────────────────────────────── */
  .result{display:flex;flex-direction:column;align-items:center;text-align:center}
  .result-head{margin-bottom:clamp(10px,2vw,18px)}
  .result-head .tag{display:block;font-size:11px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted-2);margin-bottom:4px}
  .result-head .fv{font-family:'Sora';font-weight:700;
    font-size:clamp(26px,6vw,38px);letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;color:var(--gold-bright);line-height:1}
  .donut-wrap{position:relative;width:100%;max-width:190px;aspect-ratio:1}
  .donut-wrap svg{width:100%;height:100%;display:block}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none}
  .donut-center .mult{font-family:'Sora';font-weight:600;font-size:clamp(18px,4vw,24px);
    color:var(--gold);font-variant-numeric:tabular-nums}
  .donut-center .mult-lbl{font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
  circle.seg{transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
  .legend{display:flex;gap:clamp(14px,3vw,22px);margin-top:clamp(12px,2vw,16px);flex-wrap:wrap;justify-content:center}
  .legend .item{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .dot.cap{background:var(--steel)} .dot.gn{background:var(--gold)}
  .legend .amt{font-family:'Sora';font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
  .legend .lbl{color:var(--muted);font-size:11px;display:block}

  /* ── Table — centrada ─────────────────────────────────── */
  .table-card{margin-top:clamp(12px,2vw,20px)}
  .table-card h2{font-family:'Sora';font-weight:600;font-size:15px;
    margin-bottom:14px;color:var(--text);text-align:center}
  .tbl-scroll{overflow-x:auto}
  table{margin:0 auto;width:100%;max-width:600px;border-collapse:collapse;
    font-size:clamp(12px,2vw,13px);font-variant-numeric:tabular-nums}
  th{text-align:center;color:var(--muted-2);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{text-align:center;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  tr:last-child td{border-bottom:none}
  td.year{font-family:'Sora';font-weight:600;color:var(--text)}
  td.gain{color:var(--gold)}
  td.total{font-weight:600}

  /* ── Footer ───────────────────────────────────────────── */
  footer{margin-top:clamp(22px,3vw,34px);padding-top:18px;
    border-top:1px solid var(--line-soft);text-align:center}
  footer .name{font-family:'Sora';font-weight:600;font-size:15px;color:var(--text)}
  footer .disc{font-size:12px;color:var(--muted);margin-top:6px}
  footer .src{font-size:11px;color:var(--muted-2);margin-top:8px}
  footer .src b{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img src="logoR.png" alt="logo" onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>R</div>'">
    <div>
      <h1>Calculadora de Inversión</h1>
      <div class="by">Roberto Escobar Citty</div>
    </div>
  </header>

  <div class="funds">
    <div class="funds-label">Elige un fondo — usa su rendimiento real a 10 años</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid">
    <!-- Controles -->
    <div class="card">
      <div class="control">
        <label for="r-inicial">Capital inicial</label>
        <div class="field"><span class="sym">$</span><input id="inicial" type="text" inputmode="numeric" value="1,000"></div>
        <input type="range" id="r-inicial" min="0" max="100000" step="500" value="1000">
      </div>
      <div class="control">
        <label for="r-mensual">Aporte mensual</label>
        <div class="field"><span class="sym">$</span><input id="mensual" type="text" inputmode="numeric" value="250"></div>
        <input type="range" id="r-mensual" min="0" max="5000" step="25" value="250">
      </div>
      <div class="control">
        <label for="r-anos">Plazo</label>
        <div class="field"><input id="anos" type="text" inputmode="numeric" value="20"><span class="sym suffix">años</span></div>
        <input type="range" id="r-anos" min="1" max="40" step="1" value="20">
      </div>
      <div class="control">
        <label for="r-tasa">Rendimiento anual</label>
        <div class="field"><input id="tasa" type="text" inputmode="decimal" value="7.0"><span class="sym suffix">%</span></div>
        <input type="range" id="r-tasa" min="0" max="20" step="0.1" value="7">
      </div>
    </div>

    <!-- Resultado -->
    <div class="card result">
      <div class="result-head">
        <span class="tag">Valor final</span>
        <span class="fv" id="fv">$0</span>
      </div>
      <div class="donut-wrap">
        <svg viewBox="0 0 200 200">
          <g transform="rotate(-90 100 100)">
            <circle cx="100" cy="100" r="80" fill="none" stroke="var(--line)" stroke-width="20"/>
            <circle class="seg" id="seg-cap" cx="100" cy="100" r="80" fill="none" stroke="var(--steel)" stroke-width="20"/>
            <circle class="seg" id="seg-gain" cx="100" cy="100" r="80" fill="none" stroke="var(--gold)" stroke-width="20"/>
          </g>
        </svg>
        <div class="donut-center">
          <span class="mult" id="mult">1.0x</span>
          <span class="mult-lbl">tu aporte</span>
        </div>
      </div>
      <div class="legend">
        <div class="item"><span class="dot cap"></span><div><span class="amt" id="leg-cap">$0</span><span class="lbl">Aportado</span></div></div>
        <div class="item"><span class="dot gn"></span><div><span class="amt" id="leg-gain">$0</span><span class="lbl">Ganancias</span></div></div>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card table-card">
    <h2>Crecimiento año por año</h2>
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr><th>Año</th><th>Aportado</th><th>Ganancias</th><th>Balance</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    <div class="name">Roberto Escobar Citty</div>
    <div class="disc">El rendimiento pasado no garantiza resultados futuros.</div>
    <div class="src" id="meta"></div>
  </footer>

</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const C = 2 * Math.PI * 80;

// Fallback si fund_returns.json no carga. Nombres confirmados de fuente oficial.
// Los datos reales (rendimiento + nombre) los regenera update_returns.py.
let FUNDS = {
  FELAX:{r:null,name:"Fidelity Advisor Semiconductors"},
  FKDNX:{r:null,name:"Franklin DynaTech"},
  VADAX:{r:null,name:"Invesco Equal-Weight S&P 500"},
  FOCPX:{r:null,name:"Fidelity OTC Portfolio"},
  FNIAX:{r:null,name:"Fidelity Advisor New Insights"}
};
let SOURCE = "valores manuales";

async function loadFunds(){
  try{
    const res = await fetch('fund_returns.json', {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const next = {};
    for(const [tk, info] of Object.entries(data.funds || {})){
      const r10 = info?.returns?.['10y'];
      next[tk] = {
        r: (typeof r10 === 'number') ? r10 : null,
        name: info?.name || FUNDS[tk]?.name || tk
      };
    }
    if(Object.keys(next).length) FUNDS = next;
    SOURCE = `${data.source || 'yfinance'} · actualizado ${data.as_of || ''}`;
  }catch(e){
    SOURCE = "valores de ejemplo (corre update_returns.py para datos reales)";
  }
  renderChips();
  document.getElementById('meta').innerHTML =
    `Datos: <b>${SOURCE}</b>`;
}

function renderChips(){
  const c = document.getElementById('chips');
  c.innerHTML = '';
  for(const [tk, info] of Object.entries(FUNDS)){
    const el = document.createElement('div');
    el.className = 'chip';
    const retTxt = (info.r != null) ? info.r.toFixed(2) + '%' : 'n/d';
    el.innerHTML =
      `<div class="row1"><span class="ticker">${tk}</span>
        <span class="ret ${info.r==null?'na':''}">${retTxt}</span></div>
       <div class="fund-name">${info.name || ''}</div>`;
    el.onclick = () => {
      if(info.r == null) return;
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      setTasa(info.r);
    };
    c.appendChild(el);
  }
}

function parseNum(s){ return parseFloat(String(s).replace(/[^0-9.]/g,'')) || 0; }

function link(rangeId, inputId, fmtInput){
  const range = document.getElementById(rangeId);
  const input = document.getElementById(inputId);
  range.addEventListener('input', ()=>{ input.value = fmtInput(+range.value); calc(); });
  input.addEventListener('input', ()=>{ range.value = parseNum(input.value); calc(); });
  input.addEventListener('blur', ()=>{ input.value = fmtInput(parseNum(input.value)); });
}
function setTasa(v){
  document.getElementById('r-tasa').value = v;
  document.getElementById('tasa').value = (+v).toFixed(1);
  calc();
}

function calc(){
  const P    = parseNum(document.getElementById('inicial').value);
  const PMT  = parseNum(document.getElementById('mensual').value);
  const anos = Math.max(1, Math.round(parseNum(document.getElementById('anos').value)));
  const rate = parseNum(document.getElementById('tasa').value) / 100;
  const i = rate / 12;

  const rows = [];
  let balance = P, aportado = P;
  for(let y = 1; y <= anos; y++){
    for(let m = 0; m < 12; m++){ balance = balance * (1 + i) + PMT; aportado += PMT; }
    rows.push({y, aportado, ganancias: balance - aportado, balance});
  }
  const final = rows[rows.length - 1];

  document.getElementById('fv').textContent = fmt(final.balance);
  document.getElementById('leg-cap').textContent = fmt(final.aportado);
  document.getElementById('leg-gain').textContent = fmt(final.ganancias);
  document.getElementById('mult').textContent =
    (final.balance / Math.max(final.aportado, 1)).toFixed(1) + 'x';

  const total = final.balance || 1;
  const fCap = Math.max(0, final.aportado / total);
  const fGain = Math.max(0, final.ganancias / total);
  const segCap = document.getElementById('seg-cap');
  const segGain = document.getElementById('seg-gain');
  segCap.setAttribute('stroke-dasharray', `${fCap*C} ${C}`);
  segCap.setAttribute('stroke-dashoffset', 0);
  segGain.setAttribute('stroke-dasharray', `${fGain*C} ${C}`);
  segGain.setAttribute('stroke-dashoffset', -fCap*C);

  document.getElementById('tbody').innerHTML = rows.map(r =>
    `<tr><td class="year">${r.y}</td><td>${fmt(r.aportado)}</td>
      <td class="gain">+${fmt(r.ganancias)}</td><td class="total">${fmt(r.balance)}</td></tr>`
  ).join('');
}

link('r-inicial','inicial', v => v.toLocaleString('en-US'));
link('r-mensual','mensual', v => v.toLocaleString('en-US'));
link('r-anos','anos', v => String(Math.round(v)));
link('r-tasa','tasa', v => v.toFixed(1));
loadFunds();
calc();
</script>
</body>
</html>
